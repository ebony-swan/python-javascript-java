server.address=127.0.0.1
server.port=8080

# In-memory H2, re-seeded from schema.sql + data.sql on every startup.
spring.datasource.url=jdbc:h2:mem:vulndb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

spring.thymeleaf.cache=false

# NOTE: enabling the H2 console on a real app is itself a misconfiguration.
# Left off here; the code-level demos are the focus.
